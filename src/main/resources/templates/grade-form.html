<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Оценка</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 500px;">
<h2 class="mb-4" th:text="${grade.id == null ? 'Добавить оценку' : 'Редактировать оценку'}"></h2>
<form th:action="${grade.id == null} ? @{/grades/add} : @{/grades/edit/{id}(id=${grade.id})}"  th:object="${grade}" method="post">
    <div class="mb-3">
        <label>Предмет:</label>
        <select th:field="*{subject}" class="form-select">
            <option value="Математика">Математика</option>
            <option value="Физика">Физика</option>
            <option value="Информатика">Информатика</option>
            <option value="Русский язык">Русский язык</option>
            <option value="История">История</option>
        </select>
    </div>
    <div class="mb-3">
        <label>Оценка:</label>
        <input type="number" min="2" max="5" th:field="*{grade}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Дата:</label>
        <input type="date" th:field="*{date}" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a th:href="@{/grades}" class="btn btn-secondary">Отмена</a>
</form>
</body>
</html>
