<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои оценки</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between mb-4">
    <h2>Мои оценки</h2>
    <a th:href="@{/logout}" class="btn btn-outline-danger">Выйти</a>
</div>
<form method="get" th:action="@{/grades}" class="d-flex align-items-center mb-4">
    <label class="me-2">Предмет:</label>
    <select name="subject" class="form-select me-2" style="width: 200px;">
        <option value="">Все предметы</option>
        <option value="Математика" th:selected="${subject == 'Математика'}">Математика</option>
        <option value="Физика" th:selected="${subject == 'Физика'}">Физика</option>
        <option value="Информатика" th:selected="${subject == 'Информатика'}">Информатика</option>
        <option value="Русский язык" th:selected="${subject == 'Русский язык'}">Русский язык</option>
        <option value="История" th:selected="${subject == 'История'}">История</option>
    </select>
    <button type="submit" class="btn btn-primary me-3">Найти</button>
    <a th:href="@{/grades/add}" class="btn btn-success">Добавить</a>
</form>
<table class="table table-bordered table-striped">
    <thead>
    <tr>
        <th>Предмет</th>
        <th>Оценка</th>
        <th>Дата</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="g : ${grades}">
        <td th:text="${g.subject}"></td>
        <td th:text="${g.grade}"></td>
        <td th:text="${g.date}"></td>
        <td>
            <a th:href="@{/grades/edit/{id}(id=${g.id})}" class="btn btn-sm btn-warning">Изменить</a>
            <form th:action="@{/grades/delete/{id}(id=${g.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Удалить?')">Удалить</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(grades)}">
        <td colspan="4" class="text-center">Нет оценок</td>
    </tr>
    </tbody>
</table>
</body>
</html>
